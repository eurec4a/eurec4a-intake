plugins:
  source:
    - module: intake_xarray

sources:

  2D_surface_toa:
    description: Table 1 - Surface and top-of-atmosphere 2D fields (hourly)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/MO_RAL3p3p1_km2p2/MO_RAL3p3p1_N150_km2p2.zarr/MO_RAL3p3p1_N150_table1.zarr
      consolidated: true

  2D:
    description: Table 2 - 2D column and near-surface fields (5-min)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/MO_RAL3p3p1_km2p2/MO_RAL3p3p1_N150_km2p2.zarr/MO_RAL3p3p1_N150_table2.zarr
      consolidated: true

  cross:
    description: Table 3 - 2D cross-sections at pressure levels (hourly)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/MO_RAL3p3p1_km2p2/MO_RAL3p3p1_N150_km2p2.zarr/MO_RAL3p3p1_N150_table3.zarr
      consolidated: true

  3D_circle:
    description: Table 4 - Vertical profiles around EUREC4A circle centre (5-min)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/MO_RAL3p3p1_km2p2/MO_RAL3p3p1_N150_km2p2.zarr/MO_RAL3p3p1_N150_table4.zarr
      consolidated: true

  3D:
    description: Table 5 - Full 3D domain fields (6-hourly)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/MO_RAL3p3p1_km2p2/MO_RAL3p3p1_N150_km2p2.zarr/MO_RAL3p3p1_N150_table5.zarr
      consolidated: true
