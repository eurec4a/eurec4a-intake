      consolidated: true
      remote_options:
        asynchronous: true

  2D:
    description: Table 2 - 2D column and near-surface fields
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/WRF_CTL/WRF_CTL_TBL2.zarr
      consolidated: true
      remote_options:
        asynchronous: true

