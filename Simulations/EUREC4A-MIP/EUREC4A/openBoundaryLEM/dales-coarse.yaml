plugins:
  source:
    - module: intake_xarray

description: >
  DALES coarse-resolution open-boundary large-eddy simulation on a regular
  lat/lon grid. Provides LEM Tables 1, 3, 4 and 7; Tables 2, 5 and 6 were
  not submitted. Notes on deviations from the MIP data protocol: ewss and
  nsss (Table 3) are stress magnitudes rather than signed eastward/northward
  components. capemax and cinmax (Table 4) are in J/m² rather than J/kg, and
  cinmax is stored as a positive value. prw (Table 4) is the total water path
  (vapour + condensate) rather than precipitable water vapour only.

sources:

  profiles:
    description: LEM Table 1 - Domain-averaged vertical profiles (hourly; includes full turbulence budgets)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/DALES_coarse_latlon/tab1_profile.zarr
      consolidated: true

  2D_surface_toa:
    description: LEM Table 3 - 2D surface, TOA and TOM radiation and surface flux fields (hourly)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/DALES_coarse_latlon/tab3_2D.zarr
      consolidated: true

  2D:
    description: LEM Table 4 - 2D column and near-surface fields (5-min)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/DALES_coarse_latlon/tab4_2D.zarr
      consolidated: true

  3D:
    description: LEM Table 7 - Full 3D domain fields u, v, w, t, thl, q, clwc (6-hourly)
    driver: zarr
    args:
      urlpath: https://swift.dkrz.de/v1/dkrz_0913c8f3-e7b6-4f94-9221-06880d4ccfea/DALES_coarse_latlon/tab7_3D.zarr
      consolidated: true
